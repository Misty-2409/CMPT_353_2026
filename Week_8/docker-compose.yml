services:

  couchdb:
    image: couchdb:3
    container_name: couchdb1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "5984:5984"

  node1:
    image: node:18
    container_name: node1
    depends_on:
      - couchdb
    ports:
      - "3002:3002"
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    command: sh -c "npm install && node app.js"
    environment:
      - COUCHDB_URL=http://admin:password@couchdb:5984
      - COUCHDB_DB=usersdb